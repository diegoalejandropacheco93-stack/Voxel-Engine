name: Build Voxel Engine

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.2

      - name: Install Haxelib Libraries
        run: |
          haxelib setup C:/haxelib
          haxelib install lime 8.0.1
          haxelib install openfl 9.3.3
          haxelib install flixel 5.6.1
          haxelib install flixel-addons 3.2.2
          haxelib install flixel-tools
          haxelib install flixel-ui
          haxelib install hscript-iris 1.1.3
          haxelib install tjson 1.4.0
          haxelib install hxvlc 2.0.1
          haxelib install flxanimate
          haxelib install linc_luajit
          haxelib git hxdiscord_rpc https://github.com/MASEOER/hxdiscord_rpc
          cmd /c setup\setup-windows.bat

      - name: Compile Voxel Engine
        run: |
          haxelib run lime build windows

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v3
        with:
          name: VoxelEngine-v1.0.0-Windows
          path: export/release/windows/bin/
